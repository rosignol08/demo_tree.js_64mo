<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Three.js</title>
  <style>
    body, html {
      margin: 0; padding: 0; overflow: hidden; height: 100%;
      background: #c7c7c7;
    }
    canvas#canvas {
      display: block; /* retire les marges par défaut du canvas */
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="importmap">
    {
        "imports": {
            "three": "./js/three.module.min.js",
            "gltf": "./js/GLTFLoader.js",
            "water": "./js/Water.js",
            "orbitcontrols": "./js/OrbitControls.js",
            "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
    }
}
</script>
<!--     <script src="three.module.min.js"></script> <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script> -->
<script type="module" src="./js/main.js"></script>

<button id="startButton">Démarrer la démo</button>
<style>
    body, html {
      margin: 0; padding: 0; overflow: hidden; height: 100%;
      background: #c7c7c7;
    }
  
    canvas#canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  
    #startButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 1em 2em;
      font-size: 1.2em;
      background: #222;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  
    #startButton:hover {
      background: #444;
    }
  </style>
  

</body>
</html>
