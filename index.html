<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Demo Three.js</title>
  <style>
    body, html {
      margin: 0; padding: 0; overflow: hidden; height: 100%;
      background: #c7c7c7;
    }
    canvas#canvas {
      display: block; /* retire les marges par défaut du canvas */
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="importmap">
    {
        "imports": {
            "three": "./js/three.module.min.js",
            "gltf": "./js/GLTFLoader.js",
            "water": "./js/Water.js",
            "orbitcontrols": "./js/OrbitControls.js",
            "three/addons/": "https://unpkg.com/three@latest/examples/jsm/"
    }
}
</script>
<!--     <script src="three.module.min.js"></script> <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script> -->
<script type="module" src="./js/main.js"></script>
<div id="start-screen" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: flex; justify-content: center; align-items: center;">
  <button id="start-button" style="padding: 20px 40px; font-size: 24px; cursor: pointer;">Démarrer l'expérience</button>
</div>

<script>
  document.getElementById('start-button').addEventListener('click', function() {
    // Masquer l'écran de démarrage
    document.getElementById('start-screen').style.display = 'none';
    // Démarrer l'expérience (y compris l'audio)
    initExperience();
  });

  function initExperience() {
    // Ici vous pouvez démarrer l'audio sans problèmes
    const audio = new Audio('js/assets/audio/mushroom-candy.mp3');
    setTimeout(() => audio.play(), 5000);
    
    // Autres initialisations si nécessaires
  }
</script>

</body>
</html>
